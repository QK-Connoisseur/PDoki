name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run test --workspace @pumdoki/contracts
      - run: npm run build
      - run: npm run build:admin

  api:
    name: API build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pumdoki
          POSTGRES_PASSWORD: pumdoki
          POSTGRES_DB: pumdoki_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pumdoki -d pumdoki_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pumdoki:pumdoki@localhost:5432/pumdoki_dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - run: npm run db:deploy
      - run: npx tsx packages/database/src/seed.ts
      - run: npm run test:api

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pumdoki
          POSTGRES_PASSWORD: pumdoki
          POSTGRES_DB: pumdoki_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pumdoki -d pumdoki_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://pumdoki:pumdoki@localhost:5432/pumdoki_dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - run: npm run db:deploy
      - run: npx tsx packages/database/src/seed.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
