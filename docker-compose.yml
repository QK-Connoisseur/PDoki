services:
  db:
    image: postgres:17-alpine
    container_name: pumdoki-db
    environment:
      POSTGRES_USER: pumdoki
      POSTGRES_PASSWORD: pumdoki
      POSTGRES_DB: pumdoki_dev
    ports:
      - "5432:5432"
    volumes:
      - pumdoki-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumdoki -d pumdoki_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: pumdoki-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pumdoki-db-data:
